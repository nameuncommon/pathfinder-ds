<title>Pathfinder Design System</title>
<script>
  // Storybook's default manager template ships its own <title>storybook - Storybook</title>
  // ahead of this injected head content. Per the HTML spec, document.title reads the FIRST
  // <title> element in tree order, so that default wins even though this block renders later
  // in source order - the <title> tag above alone never shows in the tab. Storybook's own
  // manager UI (react-helmet-style) also re-asserts a title on mount/route change, so a
  // one-shot overwrite isn't enough either. Force it now and pin it with a MutationObserver
  // so any later write gets immediately replaced back to the brand title.
  (function () {
    var desired = 'Pathfinder Design System';
    function pin() {
      if (document.title !== desired) document.title = desired;
    }
    pin();
    document.addEventListener('DOMContentLoaded', pin);
    window.addEventListener('load', pin);
    var titleEl = document.querySelector('title');
    if (titleEl && window.MutationObserver) {
      new MutationObserver(pin).observe(titleEl, { childList: true, characterData: true, subtree: true });
    }
  })();
</script>
